# The week's cooldown gives a compromised release time to be caught and pulled. A Gradle update also
# needs gradle/verification-metadata.xml updated (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
