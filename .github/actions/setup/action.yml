name: Set up the build
description: JDK 17 and Gradle.
inputs:
  cache:
    description: Whether to use Gradle's caches.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "17"
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: ${{ inputs.cache != 'true' }}
