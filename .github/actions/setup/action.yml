name: Set up the build
description: JDK 17 and the Android SDK packages build.sh names.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"
    # The runners' SDK has its licences accepted already. The versions come from build.sh, so
    # they're set in one place.
    - name: Android SDK
      shell: bash
      run: |
        build_tools=$(sed -n 's/^BUILD_TOOLS=//p' build.sh)
        compile_sdk=$(sed -n 's/^COMPILE_SDK=//p' build.sh)
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$build_tools" "platforms;android-$compile_sdk" > /dev/null
