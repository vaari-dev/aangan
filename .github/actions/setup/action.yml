name: Set up the build
description: JDK 17 and Gradle.
inputs:
  cache:
    description: Whether to use Gradle's caches.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # The MIT-licensed cache, not the default closed-source "enhanced" one.
        cache-provider: basic
        cache-disabled: ${{ inputs.cache != 'true' }}
