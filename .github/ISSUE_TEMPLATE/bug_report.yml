name: Something isn't working
description: Report a problem with Aangan on your TV.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: see the [security policy](https://github.com/vaari-dev/aangan/security/policy) instead.
  - type: input
    id: tv
    attributes:
      label: TV brand and model
      placeholder: e.g. Sony Bravia KD-55X80K, Chromecast with Google TV, Mi Box S
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android TV or Google TV version
      description: TV Settings → About.
      placeholder: e.g. Google TV, Android 12
  - type: input
    id: version
    attributes:
      label: Aangan version
      description: In Aangan's Settings.
      placeholder: e.g. 1.2
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - Google Play
        - GitHub Releases
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or photo
      description: A photo of the screen is fine. Blur names you'd rather not share.
