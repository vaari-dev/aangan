# Every push and pull request: test, lint and build the app, check the build is reproducible, start
# it on Android TV and Google TV emulators, build the website, and audit these workflows with
# zizmor. On main: publish the website, and when versionName in app/build.gradle.kts has no release
# yet, release it.
#
# Supply chain: every action is pinned to a full commit (Dependabot proposes updates after a week's
# cooldown), Gradle checks every dependency against gradle/verification-metadata.xml, checkouts
# don't keep the token, each job gets only the permissions it needs, the release build uses no
# cache, and it fails unless the APK and the bundle are signed with the known certificate.
#
# Releasing runs in the "release" environment, which waits for an owner's approval and alone holds
# the signing key (AANGAN_KEYSTORE_B64, AANGAN_KEY_PASS). It publishes the GitHub release, and also
# uploads to Google Play's internal track once a PLAY_SERVICE_ACCOUNT_JSON secret exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the sitemap dates each page by its last change.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Version and changelog
        id: version
        run: |
          echo "version=$(python3 tools/release.py version)" >> "$GITHUB_OUTPUT"
          echo "tag=$(python3 tools/release.py tag)" >> "$GITHUB_OUTPUT"
          python3 tools/release.py notes > /dev/null   # fails if CHANGELOG.md lacks this version
          if git ls-remote --exit-code --tags origin "refs/tags/$(python3 tools/release.py tag)" > /dev/null; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

      # Unit tests, Android Lint and javac -Xlint, all with warnings as errors; then the release
      # APK and bundle, minified, signed with the runner's debug key.
      - name: Test, lint and build
        run: ./gradlew check assembleRelease bundleRelease

      - name: Check the build is reproducible
        run: |
          sha256sum app/build/outputs/apk/release/aangan-release.apk app/build/outputs/bundle/release/aangan-release.aab > first.sha
          ./gradlew clean assembleRelease bundleRelease --no-build-cache --rerun-tasks
          sha256sum --check first.sha

      - name: Check the icon's generated files are current
        run: python3 tools/icon.py && git diff --exit-code

      - name: Build the website
        run: python3 tools/site.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aangan-${{ steps.version.outputs.version }}-dev
          path: app/build/outputs/apk/release/aangan-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: build/site

  # Installs the minified release build on the TV versions Aangan is checked on, makes it the home
  # screen, plays festival scenes, starts the screensaver, opens it in Hindi, and fails on any crash
  # or "isn't responding".
  tv:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android TV 13
            api-level: 33
            target: android-tv
            arch: x86
          # Only an x86 image exists, and its emulator's graphics crash on GitHub's runners part way
          # through: it runs, but doesn't hold up the build.
          - name: Google TV 14
            api-level: 34
            target: google-tv
            arch: x86
            experimental: true
          - name: Google TV 16
            api-level: 36
            target: google-tv
            arch: x86_64
    name: tv (${{ matrix.name }})
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aangan-${{ needs.build.outputs.version }}-dev
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: tools/tv-smoke-test.sh apk/aangan-release.apk screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tv-screenshots-${{ matrix.api-level }}-${{ matrix.target }}
          path: screenshots/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  # The website doesn't wait for the emulators: it describes the app, and changes on its own too.
  website:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: [build, tv, audit]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      # The release certificate; a build signed with anything else must not be published.
      CERT_SHA256: 7f905b6d3cfbcc92cd2da7203c5b6cf365b65d67cb3d162a4c54d4043caa1484
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Gradle cache: nothing another job wrote may run while the signing key is here.
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      # Release files keep their old names, so the "latest/download/aangan.apk" link still works.
      - name: Build, signed for release
        env:
          KEYSTORE_B64: ${{ secrets.AANGAN_KEYSTORE_B64 }}
          AANGAN_KEY_PASS: ${{ secrets.AANGAN_KEY_PASS }}
        run: |
          export AANGAN_KEYSTORE="$RUNNER_TEMP/release.jks"
          # Readable only by this user, and deleted however the step ends.
          umask 077
          trap 'rm -f "$AANGAN_KEYSTORE"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$AANGAN_KEYSTORE"
          ./gradlew assembleRelease bundleRelease --no-build-cache --no-configuration-cache --no-daemon
          mkdir -p build
          cp app/build/outputs/apk/release/aangan-release.apk build/aangan.apk
          cp app/build/outputs/bundle/release/aangan-release.aab build/aangan.aab

      - name: Check both are signed with the release certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs build/aangan.apk | grep -q "SHA-256 digest: $CERT_SHA256"
          # The bundle is a signed JAR: every entry must verify, with the same certificate.
          jarsigner -verify build/aangan.aab > /dev/null
          keytool -printcert -jarfile build/aangan.aab | sed -n 's/^\s*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' \
            | grep -qx "$CERT_SHA256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/aangan.apk
            build/aangan.aab

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python3 tools/release.py notes
            echo
            echo "**Install or update:** in the *Downloader* app on your TV, enter \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/aangan.apk\`. See [how to install](https://vaari-dev.github.io/aangan/install.html)."
            echo
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
            echo
            echo "Build provenance: \`gh attestation verify aangan.apk --repo $GITHUB_REPOSITORY\`"
          } > notes.md
          gh release create "$TAG" build/aangan.apk build/aangan.aab \
            --title "Aangan $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Is Google Play set up?
        id: play
        env:
          CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"

      # Until the app's first production release, Play accepts only drafts; then set the
      # PLAY_RELEASE_STATUS variable to "completed" to roll out to testers straight away.
      - name: Upload to Google Play (internal testing)
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.vaari.aangan
          releaseFiles: build/aangan.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
