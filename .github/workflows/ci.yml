# On main, a versionName with no tag yet is released. The "release" environment needs an owner's
# approval and alone holds the signing secrets (AANGAN_KEYSTORE_B64, AANGAN_KEY_PASS,
# PLAY_SERVICE_ACCOUNT_JSON).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sitemap dates each page from git history.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # On main the emulators always run: a release waits for them.
      - name: Does the app change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] \
            || git diff --no-renames --name-only HEAD^1 HEAD | grep -qvE '^(site/|store/|fastlane/|docs/|[^/]+\.md$|\.github/ISSUE_TEMPLATE/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version and changelog
        id: version
        run: |
          echo "version=$(python3 tools/release.py version)" >> "$GITHUB_OUTPUT"
          echo "tag=$(python3 tools/release.py tag)" >> "$GITHUB_OUTPUT"
          python3 tools/release.py notes > /dev/null   # fails if CHANGELOG.md lacks this version
          if git ls-remote --exit-code --tags origin "refs/tags/$(python3 tools/release.py tag)" > /dev/null; then
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the store listing, and that generated files are current
        run: |
          python3 tools/icon.py
          python3 tools/store.py
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Test, lint and build
        run: ./gradlew check assembleRelease bundleRelease

      - name: Check the build is reproducible
        run: |
          sha256sum app/build/outputs/apk/release/aangan-release.apk app/build/outputs/bundle/release/aangan-release.aab > first.sha
          ./gradlew clean assembleRelease bundleRelease --no-build-cache --rerun-tasks
          sha256sum --check first.sha

      - name: Build the website
        run: python3 tools/site.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aangan-${{ steps.version.outputs.version }}-dev
          path: app/build/outputs/apk/release/aangan-release.apk
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: build/site

  tv:
    needs: build
    if: needs.build.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android TV 13
            api-level: 33
            target: android-tv
            arch: x86
          # Not Google TV 14: its x86-only image's graphics fail part way on GitHub's runners.
          - name: Google TV 16
            api-level: 36
            target: google-tv
            arch: x86_64
    name: tv (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aangan-${{ needs.build.outputs.version }}-dev
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install a QR code reader
        run: sudo apt-get install -y --no-install-recommends zbar-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}/${{ matrix.target }}/${{ matrix.arch }}
          key: system-image-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          # Without it the emulator is a portrait phone.
          profile: tv_1080p
          disable-animations: true
          script: tools/tv-smoke-test.sh apk/aangan-release.apk screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tv-screenshots-${{ matrix.api-level }}-${{ matrix.target }}
          path: screenshots/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  website:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    needs: [build, tv, audit]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Build provenance.
      id-token: write
      attestations: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      CERT_SHA256: 7f905b6d3cfbcc92cd2da7203c5b6cf365b65d67cb3d162a4c54d4043caa1484
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Gradle cache: nothing another job wrote may run beside the signing key.
      - uses: ./.github/actions/setup
        with:
          cache: "false"

      # The "latest/download/aangan.apk" link depends on these file names.
      - name: Build, signed for release
        env:
          KEYSTORE_B64: ${{ secrets.AANGAN_KEYSTORE_B64 }}
          AANGAN_KEY_PASS: ${{ secrets.AANGAN_KEY_PASS }}
        run: |
          export AANGAN_KEYSTORE="$RUNNER_TEMP/release.jks"
          umask 077
          trap 'rm -f "$AANGAN_KEYSTORE"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$AANGAN_KEYSTORE"
          ./gradlew assembleRelease bundleRelease --no-build-cache --no-configuration-cache --no-daemon
          mkdir -p build
          cp app/build/outputs/apk/release/aangan-release.apk build/aangan.apk
          cp app/build/outputs/bundle/release/aangan-release.aab build/aangan.aab

      # The emulators tested the build job's debug-signed APK. The signature sits outside the
      # zip entries (no v1 signing at minSdk 28), so every entry must match.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aangan-${{ needs.build.outputs.version }}-dev
          path: tested
      - name: Check it's the APK the emulators tested
        run: |
          python3 - tested/aangan-release.apk build/aangan.apk <<'PY'
          import sys, zipfile
          def entries(path):
              with zipfile.ZipFile(path) as z:
                  return {i.filename: (i.CRC, i.file_size) for i in z.infolist()}
          tested, released = (entries(p) for p in sys.argv[1:])
          if tested != released:
              diff = sorted(set(tested.items()) ^ set(released.items()))
              sys.exit("The release APK differs from the tested one:\n" + "\n".join(map(str, diff[:20])))
          print(f"Same {len(released)} entries as the tested APK.")
          PY

      - name: Check both are signed with the release certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs build/aangan.apk | grep -q "SHA-256 digest: $CERT_SHA256"
          # The bundle is a JAR: every entry must be signed, with the same certificate.
          verified="$(jarsigner -verify build/aangan.aab)"
          grep -q "^jar verified" <<< "$verified"
          if grep -q "unsigned entries" <<< "$verified"; then exit 1; fi
          keytool -printcert -jarfile build/aangan.aab | sed -n 's/^\s*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' \
            | grep -qx "$CERT_SHA256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/aangan.apk
            build/aangan.aab

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python3 tools/release.py notes
            echo
            echo "**Install or update:** in the *Downloader* app on your TV, enter \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/aangan.apk\`. See [how to install](https://vaari-dev.github.io/aangan/install.html)."
            echo
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
            echo
            echo "Build provenance: \`gh attestation verify aangan.apk --repo $GITHUB_REPOSITORY\`"
          } > notes.md
          # Already there when re-running after a failed Play upload.
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" build/aangan.apk build/aangan.aab \
            --title "Aangan $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Is Google Play set up?
        id: play
        env:
          CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"

      - name: Release notes for Play
        if: steps.play.outputs.configured == 'true'
        run: |
          mkdir whatsnew
          cp "fastlane/metadata/android/en-IN/changelogs/$(python3 tools/release.py code).txt" whatsnew/whatsnew-en-IN

      # Play accepts only drafts until the first production release; then set
      # PLAY_RELEASE_STATUS=completed.
      - name: Upload to Google Play (internal testing)
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.vaari.aangan
          releaseFiles: build/aangan.aab
          whatsNewDirectory: whatsnew
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
