<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect width="48" height="48" rx="11"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3A8"/><stop offset="0.45" stop-color="#FF9E6B"/><stop offset="1" stop-color="#7B4BA8"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="19" cy="19" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBE8" stop-opacity="0.95"/><stop offset="0.35" stop-color="#FFF1C4" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF1C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9532C"/><stop offset="1" stop-color="#E58A55"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9955C"/><stop offset="1" stop-color="#FFC58C"/></linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#7C2E1C"/><stop offset="1" stop-color="#B4502E"/></linearGradient>
    <linearGradient id="bottom" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5E2418"/><stop offset="1" stop-color="#9A4027"/></linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <!-- four walls rising towards the open sky -->
    <path d="M0,0 H48 L33,15 H15 Z" fill="url(#top)"/>
    <path d="M0,0 L15,15 V33 L0,48 Z" fill="url(#left)"/>
    <path d="M48,0 V48 L33,33 V15 Z" fill="url(#right)"/>
    <path d="M0,48 L15,33 H33 L48,48 Z" fill="url(#bottom)"/>
    <!-- arched windows on the walls, foreshortened -->
    <g fill="#3A140C" fill-opacity="0.45">
      <path d="M5.2,28 V20.6 A1.5,1.5 0 0 1 8.2,20.6 V26.8 Z"/>
      <path d="M42.8,28 V20.6 A1.5,1.5 0 0 0 39.8,20.6 V26.8 Z"/>
      <path d="M21,9.2 L21.5,6.6 A2.5,2.5 0 0 1 26.5,6.6 L27,9.2 Z"/>
      <path d="M21,38.8 L21.5,41.4 A2.5,2.5 0 0 0 26.5,41.4 L27,38.8 Z"/>
    </g>
    <!-- the cornice where each wall meets the sky -->
    <path d="M15,15 H33 V33 H15 Z" fill="none" stroke="#FFE2BA" stroke-width="1.6" stroke-opacity="0.9"/>
    <!-- the open sky -->
    <rect x="15.8" y="15.8" width="16.4" height="16.4" fill="url(#sky)"/>
    <rect x="15.8" y="15.8" width="16.4" height="16.4" fill="url(#sunglow)"/>
    <circle cx="19.6" cy="19.6" r="2.6" fill="#FFFDF2"/>
    <!-- two birds crossing -->
    <g fill="none" stroke="#3B1F4A" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24.6,25.4 q0.9,-0.9 1.8,0 q0.9,-0.9 1.8,0"/>
      <path d="M27.8,22.6 q0.6,-0.6 1.2,0 q0.6,-0.6 1.2,0"/>
    </g>
    <!-- converging seams, for depth -->
    <g stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.5">
      <path d="M0,0 L15,15 M48,0 L33,15 M0,48 L15,33 M48,48 L33,33"/>
    </g>
  </g>
</svg>
